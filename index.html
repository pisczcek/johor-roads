<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Johor Roads 2025</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
:root{
  --bg:rgba(255,255,255,.78);--bg-solid:#fff;--fg:#0f172a;--muted:#64748b;--line:rgba(15,23,42,.1);
  --accent:#4f46e5;--chip:rgba(15,23,42,.05);--shadow:0 10px 30px rgba(15,23,42,.15);
}
[data-theme=dark]{
  --bg:rgba(17,24,39,.78);--bg-solid:#111827;--fg:#f1f5f9;--muted:#94a3b8;--line:rgba(255,255,255,.1);
  --accent:#818cf8;--chip:rgba(255,255,255,.07);--shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0}
html,body,#map{height:100%}
body{font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--bg-solid)}
.glass{background:var(--bg);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
#bar{position:absolute;z-index:1000;top:12px;left:12px;right:12px;max-width:520px;display:flex;align-items:center;gap:10px;padding:8px 10px}
.brand{font-weight:700;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#06b6d4);display:grid;place-items:center;font-style:normal;font-size:15px}
#q{flex:1;min-width:0;border:0;outline:0;background:var(--chip);color:var(--fg);padding:8px 12px;border-radius:10px;font:inherit}
select{width:100%;font:inherit;color:var(--fg);background:var(--chip);border:0;border-radius:10px;padding:8px 10px;outline:0}
option{background:var(--bg-solid);color:var(--fg)}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:var(--chip);border-radius:10px;padding:8px 10px;transition:.15s}
button:hover{background:var(--accent);color:#fff}
#panel{position:absolute;z-index:1000;top:12px;right:12px;width:260px;padding:14px;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 24px);overflow:auto}
h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-direction:column;gap:4px}
.chip{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;cursor:pointer;user-select:none;transition:.15s}
.chip:hover{background:var(--chip)}
.chip input{accent-color:var(--accent)}
.sw{width:22px;height:4px;border-radius:2px}
.chip span.n{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.loading .n::after{content:"…"}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--chip);border-radius:12px;padding:10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:11px}
.row{display:flex;gap:8px}.row button{flex:1}
#prog{position:absolute;z-index:1100;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#6366f1,#06b6d4);transition:width .3s,opacity .5s}
#toast{position:absolute;z-index:1200;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;padding:10px 16px;pointer-events:none;transition:.3s}
#toast.on{opacity:1;transform:translate(-50%,0)}
.note{font-size:11px;color:var(--muted)}
.leaflet-container{background:var(--bg-solid);font:inherit}
#map.inv .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.88) saturate(.55)}
[data-theme=dark] .leaflet-control-attribution{background:rgba(17,24,39,.7);color:#94a3b8}
[data-theme=dark] .leaflet-control-attribution a{color:#a5b4fc}
[data-theme=dark] .leaflet-bar a,[data-theme=dark] .leaflet-popup-content-wrapper,[data-theme=dark] .leaflet-popup-tip,[data-theme=dark] .leaflet-tooltip{background:#1f2937;color:#f1f5f9;border-color:#374151}
@media(max-width:700px){
  #panel{top:auto;bottom:12px;left:12px;right:12px;width:auto;max-height:42%}
  .brand span{display:none}
}
</style>
</head>
<body>
<div id="prog"></div>
<div id="map"></div>

<div id="bar" class="glass">
  <div class="brand"><i>🛣️</i><span>Johor Roads</span></div>
  <input id="q" type="search" placeholder="Search a place, press Enter…" autocomplete="off" />
  <button id="theme" title="Toggle theme">🌙</button>
</div>

<aside id="panel" class="glass">
  <div>
    <h4>Basemap</h4>
    <select id="base"></select>
  </div>
  <div>
    <h4>Layers</h4>
    <div class="chips" id="chips"></div>
  </div>
  <div>
    <h4>Measure · click map</h4>
    <div class="stats">
      <div class="stat"><b id="sCount">0</b><small>Markers</small></div>
      <div class="stat"><b id="sTotal">0</b><small>Total km</small></div>
      <div class="stat"><b id="sLeg">—</b><small>Last leg km</small></div>
      <div class="stat"><b id="sBear">—</b><small>Bearing</small></div>
    </div>
  </div>
  <div class="row">
    <button id="bCsv">⬇ CSV</button>
    <button id="bPng">🖼 PNG</button>
    <button id="bClr">🗑</button>
  </div>
  <div class="note">Road data cached locally for 7 days. <a href="#" id="refresh" style="color:var(--accent)">Refresh</a><br>© OpenStreetMap contributors</div>
</aside>
<div id="toast" class="glass"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dom-to-image@2.6.0/src/dom-to-image.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const TYPES = [
  ['motorway','Motorway','#ef4444','way["highway"="motorway"]',3],
  ['trunk','Trunk','#a855f7','way["highway"="trunk"]',2.6],
  ['primary','Primary','#3b82f6','way["highway"="primary"]',2.2],
  ['rail','Railway','#64748b','way["railway"="rail"]',1.6,'6 6'],
  ['felda','FELDA','#06b6d4','way["highway"]["name"~"FELDA",i]',2],
  ['secondary','Secondary','#10b981','way["highway"="secondary"]',1.6],
  ['tertiary','Tertiary','#f97316','way["highway"="tertiary"]',1.2],
];
const ENDPOINTS = ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const TTL = 7*864e5, CONCURRENCY = 3;

/* ---------- Map ---------- */
const map = L.map('map',{
  preferCanvas:true, zoomControl:false, zoomSnap:.5,
  renderer:L.canvas({padding:.3}),
  maxBounds:[[0.9,102.2],[3.3,104.7]], maxBoundsViscosity:.5
}).setView([1.85,103.4],9);
L.control.zoom({position:'bottomleft'}).addTo(map);
L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);

// Keyless basemaps. Esri works from file:// too (OSM blocks pages that send no Referer).
const BASES = {
  esri:{name:'Esri Streets',url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    max:19,native:17,inv:true,attr:'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors'},
  osm:{name:'OpenStreetMap',url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    max:19,native:19,inv:true,attr:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'},
  esridark:{name:'Esri Dark Gray (low zoom detail)',url:'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
    max:19,native:16,inv:false,attr:'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors'},
  sat:{name:'Esri Satellite',url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    max:19,native:18,inv:false,attr:'Tiles © Esri — Maxar, Earthstar Geographics'}
};
$('base').innerHTML = Object.entries(BASES).map(([k,b])=>`<option value="${k}">${b.name}</option>`).join('');
let baseKey = localStorage.getItem('jr-base'); if(!BASES[baseKey]) baseKey='esri';
let baseLayer, errs=0;
function setBase(k){
  baseKey=k; const b=BASES[k]; errs=0;
  baseLayer && map.removeLayer(baseLayer);
  baseLayer = L.tileLayer(b.url,{attribution:b.attr,maxZoom:b.max,maxNativeZoom:b.native,crossOrigin:true}).addTo(map).bringToBack();
  baseLayer.on('tileerror',()=>{ // auto-fallback if a provider blocks us
    if(++errs===8 && k!=='esri'){ toast(b.name+' is blocking tiles — switched to Esri'); $('base').value='esri'; setBase('esri'); }
    else if(errs===8) toast('Tiles failing to load — pick another basemap');
  });
  $('base').value=k; localStorage.setItem('jr-base',k); tint();
}
$('base').onchange=e=>setBase(e.target.value);
// Dark mode is the default; a saved choice is respected
let theme = localStorage.getItem('jr-theme') || 'dark';
function tint(){ $('map').classList.toggle('inv', theme==='dark' && BASES[baseKey].inv); }
function applyTheme(){
  document.documentElement.dataset.theme = theme;
  $('theme').textContent = theme==='dark'?'☀️':'🌙';
  tint();
}
$('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('jr-theme',theme);applyTheme()};
applyTheme();
setBase(baseKey);

/* ---------- Layer chips ---------- */
const layers = {};
const MINZ = {secondary:9, felda:9, tertiary:10}; // draw dense layers only when zoomed in
function sync(){
  const z=map.getZoom();
  for(const k in layers){
    const on=$('chip-'+k).querySelector('input').checked && z>=(MINZ[k]||0);
    on?layers[k].addTo(map):map.removeLayer(layers[k]);
  }
}
map.on('zoomend',sync);
$('chips').innerHTML = TYPES.map(([k,label,c])=>`
  <label class="chip loading" id="chip-${k}"><input type="checkbox" data-k="${k}" checked>
  <i class="sw" style="background:${c}"></i>${label}${MINZ[k]?` <small style="color:var(--muted)">z${MINZ[k]}+</small>`:''}<span class="n"></span></label>`).join('');
$('chips').addEventListener('change',e=>{
  sync();
});

/* ---------- IndexedDB cache ---------- */
const db = new Promise(res=>{
  const r = indexedDB.open('johor-roads',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('c');
  r.onsuccess=()=>res(r.result); r.onerror=()=>res(null);
});
async function cacheGet(k){
  const d = await db; if(!d) return null;
  return new Promise(res=>{const q=d.transaction('c').objectStore('c').get(k);
    q.onsuccess=()=>res(q.result&&Date.now()-q.result.t<TTL?q.result.v:null);q.onerror=()=>res(null)});
}
async function cacheSet(k,v){const d=await db; if(d) d.transaction('c','readwrite').objectStore('c').put({t:Date.now(),v},k)}

/* ---------- Fetch (one query per type for the whole state) ---------- */
async function overpass(sel){
  // bbox is far cheaper than an area lookup; 'skel' drops tags we never use
  const q = `[out:json][timeout:60][bbox:1.15,102.45,2.9,104.5];${sel};out skel geom qt;`;
  let err;
  for(const url of ENDPOINTS){
    try{
      const r = await fetch(url,{method:'POST',body:'data='+encodeURIComponent(q)});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j = await r.json();
      // compact: round to 5 dp, keep only coordinate arrays
      return j.elements.filter(e=>e.geometry?.length>1).map(e=>{
        // drop points <~8 m apart (invisible, but costly to draw and cache)
        const g=e.geometry, out=[[g[0].lat,g[0].lon]];
        for(let i=1;i<g.length-1;i++){
          const l=out[out.length-1];
          if(Math.abs(g[i].lat-l[0])+Math.abs(g[i].lon-l[1])>.00008) out.push([g[i].lat,g[i].lon]);
        }
        const z=g[g.length-1]; out.push([z.lat,z.lon]);
        return out.map(p=>[+p[0].toFixed(5),+p[1].toFixed(5)]);
      });
    }catch(e){err=e}
  }
  throw err;
}
async function loadType([k,label,color,sel,weight,dash]){
  const chip = $('chip-'+k);
  try{
    const key='v2-'+k;
    let lines = await cacheGet(key);
    if(!lines){ lines = await overpass(sel); cacheSet(key,lines); }
    // ONE multi-polyline per type instead of thousands of objects
    const layer = L.polyline(lines,{color,weight,opacity:.85,dashArray:dash,
      smoothFactor:1.5,interactive:false,lineCap:'round',lineJoin:'round'});
    layers[k]=layer;
    sync();
    chip.querySelector('.n').textContent = lines.length.toLocaleString();
  }catch(e){
    chip.querySelector('.n').textContent='⚠';
    chip.title='Failed: '+e.message+' (click Refresh to retry)';
  }
  chip.classList.remove('loading');
}
async function loadAll(){
  $('prog').style.opacity=1;$('prog').style.width='5%';
  const t0=performance.now();
  if(!(await db)) toast('Cache unavailable here — open via http://localhost for instant reloads');
  let done=0, i=0;
  const worker = async()=>{
    while(i<TYPES.length){
      await loadType(TYPES[i++]);
      $('prog').style.width = (5+95*++done/TYPES.length)+'%';
    }
  };
  await Promise.all(Array.from({length:CONCURRENCY},worker));
  setTimeout(()=>$('prog').style.opacity=0,400);
  console.log('roads loaded in',((performance.now()-t0)/1000).toFixed(1),'s');
}
$('refresh').onclick=async e=>{
  e.preventDefault();
  const d=await db; if(d) d.transaction('c','readwrite').objectStore('c').clear();
  Object.values(layers).forEach(l=>map.removeLayer(l));
  for(const k in layers) delete layers[k];
  TYPES.forEach(t=>$('chip-'+t[0]).classList.add('loading'));
  loadAll();
};
loadAll();

/* ---------- Measuring (no turf needed) ---------- */
const R=6371.0088, rad=d=>d*Math.PI/180;
function dist(a,b){
  const dLa=rad(b.lat-a.lat), dLo=rad(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function bearing(a,b){
  const y=Math.sin(rad(b.lng-a.lng))*Math.cos(rad(b.lat));
  const x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng-a.lng));
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
const pts=[], dots=[];
const path=L.polyline([],{color:'#6366f1',weight:3,dashArray:'2 8',lineCap:'round',interactive:false}).addTo(map);
const dotLayer=L.layerGroup().addTo(map);

map.on('click',e=>{
  const p=e.latlng, dot=L.circleMarker(p,{radius:7,fillColor:'#6366f1',fillOpacity:1,color:'#fff',weight:2,bubblingMouseEvents:false}).addTo(dotLayer);
  pts.push(p); dots.push(dot);
  dot.bindTooltip(`#${pts.length} · ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}<br><small>Click to remove</small>`);
  dot.on('click',()=>{const i=dots.indexOf(dot);dotLayer.removeLayer(dot);dots.splice(i,1);pts.splice(i,1);refresh()});
  refresh();
});
function refresh(){
  path.setLatLngs(pts);
  const n=pts.length; $('sCount').textContent=n;
  let total=0; for(let i=1;i<n;i++) total+=dist(pts[i-1],pts[i]);
  $('sTotal').textContent=total.toFixed(2);
  if(n>1){const a=pts[n-2],b=pts[n-1];$('sLeg').textContent=dist(a,b).toFixed(2);$('sBear').textContent=bearing(a,b).toFixed(0)+'°'}
  else{$('sLeg').textContent='—';$('sBear').textContent='—'}
}
$('bClr').onclick=()=>{dotLayer.clearLayers();pts.length=dots.length=0;refresh()};

/* ---------- Search (debounced, Enter/typing) ---------- */
let timer, searchMarker;
$('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const v=e.target.value.trim(); if(v.length<3) return;
  {(async()=>{
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(v)}&viewbox=102.5,3.03,104.5,1.15&bounded=1`);
      const [hit]=await r.json();
      if(!hit) return toast('No results in Johor');
      const ll=[+hit.lat,+hit.lon];
      map.flyTo(ll,13,{duration:1});
      searchMarker&&map.removeLayer(searchMarker);
      searchMarker=L.marker(ll).addTo(map).bindPopup(`<b>${hit.display_name.split(',')[0]}</b>`).openPopup();
    }catch{toast('Search failed')}
  })()}
});

/* ---------- Export ---------- */
$('bCsv').onclick=()=>{
  if(!pts.length) return toast('No markers yet');
  const rows=['Index,Latitude,Longitude,Leg km,Bearing'];
  pts.forEach((p,i)=>rows.push([i+1,p.lat.toFixed(5),p.lng.toFixed(5),
    i?dist(pts[i-1],p).toFixed(2):'',i?bearing(pts[i-1],p).toFixed(0):''].join(',')));
  save(URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'})),'markers.csv');
  toast(`Exported ${pts.length} markers`);
};
$('bPng').onclick=()=>{
  toast('Rendering…');
  domtoimage.toPng($('map'),{filter:n=>!n.classList?.contains('leaflet-control-container')})
    .then(u=>{save(u,'johor-map.png');toast('Map saved')}).catch(()=>toast('PNG export failed'));
};
function save(href,name){const a=document.createElement('a');a.href=href;a.download=name;a.click()}
let tt; function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2500)}
</script>
</body>
</html>
